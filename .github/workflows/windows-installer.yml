name: Construir instalador Windows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'installer/**'
      - 'desktop/**'
      - 'api/**'
      - 'tests/**'
      - 'web/**'
      - 'package*.json'
  workflow_dispatch:
    inputs:
      postgres_zip_url:
        description: URL del ZIP de binarios x64 de EnterpriseDB
        required: false
        type: string
      postgres_sha256:
        description: SHA-256 de ese ZIP
        required: false
        type: string
      winsw_url:
        description: URL de WinSW-x64.exe en winsw/winsw/releases/download
        required: false
        type: string
      winsw_sha256:
        description: SHA-256 del ejecutable WinSW
        required: false
        type: string
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          'C:\Program Files (x86)\Inno Setup 6' >> $env:GITHUB_PATH
      - name: Preparar dependencias del instalador
        shell: pwsh
        env:
          PG_URL: ${{ inputs.postgres_zip_url }}
          PG_SHA: ${{ inputs.postgres_sha256 }}
          WINSW_URL: ${{ inputs.winsw_url }}
          WINSW_SHA: ${{ inputs.winsw_sha256 }}
        run: |
          $pgUrl = if ($env:PG_URL) { $env:PG_URL } else { 'https://get.enterprisedb.com/postgresql/postgresql-17.11-3-windows-x64-binaries.zip' }
          $winUrl = if ($env:WINSW_URL) { $env:WINSW_URL } else { 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' }
          $pgSha = $env:PG_SHA
          $winSha = $env:WINSW_SHA
          if (!$pgSha) {
            $probe = Join-Path $env:RUNNER_TEMP 'postgres-source.zip'
            Invoke-WebRequest -Uri $pgUrl -OutFile $probe
            $pgSha = (Get-FileHash -Algorithm SHA256 $probe).Hash
            Remove-Item $probe
            Write-Host "SHA-256 PostgreSQL descargado: $pgSha"
          }
          if (!$winSha) {
            $probe = Join-Path $env:RUNNER_TEMP 'winsw-source.exe'
            Invoke-WebRequest -Uri $winUrl -OutFile $probe
            $winSha = (Get-FileHash -Algorithm SHA256 $probe).Hash
            Remove-Item $probe
            Write-Host "SHA-256 WinSW descargado: $winSha"
          }
          ./installer/prepare-payload.ps1 -PostgresZipUrl $pgUrl -PostgresSha256 $pgSha -WinSWUrl $winUrl -WinSWSha256 $winSha
      - name: Compilar interfaz, servicio, Tauri e instalador
        shell: pwsh
        run: ./installer/build-windows.ps1
      - name: Publicar artefacto privado del flujo
        uses: actions/upload-artifact@v4
        with:
          name: GestionIglesiaPro-Setup-Windows-x64
          path: installer/Output/GestionIglesiaPro-Setup-0.1.1.exe
          if-no-files-found: error
          retention-days: 7
