name: Build Control de Energia v2.7 - Gemini and mail diagnosis
on:
  push:
    branches: [control-de-energia-gemini-cuenta-v27]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer fuente 2.7
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source-v27.tar.gz.base64 | tar -xz -C android-build
          test -f android-build/tests/test_v27.cjs
      - name: Probar lector, API Gemini, y cuentas
        working-directory: android-build
        run: |
          node --check app/src/main/assets/energy-ai.js
          node --check app/src/main/assets/energy-mail.js
          node tests/test_v27.cjs
          node tests/test_v26.cjs
          node tests/test_multi_ai_v253.cjs
          node tests/test_invoice_parser_v24.js
          node tests/test_v25.cjs
          node tests/verificar.js
      - name: Compilar APK Android
        working-directory: android-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-Energia-v2-7-APK-PRUEBAS
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
