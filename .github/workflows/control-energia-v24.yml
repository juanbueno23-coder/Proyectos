name: Build Control de Energia v2.4 - reparacion de consumos
on:
  push:
    branches: [control-de-energia-lector-v24]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer fuente v2.4
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source-v24.tar.gz.base64 | tar -xz -C android-build
          test -f android-build/app/src/main/java/com/controlenergia/app/OfflinePdfExtractor.java
          grep -q "retryAfterParserUpgrade" android-build/app/src/main/java/com/controlenergia/app/EnergyMailVault.java
      - name: Pruebas de lectura y seguridad
        run: |
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/energy-mail.js
          node --check android-build/app/src/main/assets/edesur-validation.js
          cd android-build
          node tests/verificar.js
          node tests/test_invoice_parser_v24.js
          mkdir -p tests/java-out
          javac -d tests/java-out app/src/main/java/com/controlenergia/app/EdesurMailMatcher.java tests/MailMatcherTest.java
          java -cp tests/java-out MailMatcherTest
      - name: Compilar APK Android
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-Energia-v2-4-Lector-Automatico-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
