name: Control de Energía 3.0 Gemini e informes offline
on:
  push:
    branches: [control-de-energia-gemini-reporte-v30]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer proyecto 3.0
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source-v30.tar.gz.base64 | tar -xz -C android-build
          test -f android-build/app/src/main/java/com/controlenergia/app/GeminiModelPlanner.java
          test -f android-build/app/src/main/assets/energy-comparison-ui.js
      - name: Probar lógica Gemini y comparador
        working-directory: android-build
        run: |
          node --check app/src/main/assets/energy-ai.js
          node --check app/src/main/assets/energy-comparison-ui.js
          node tests/test_v30.cjs
          node tests/test_energy_comparator.cjs
          node tests/test_v28.cjs
          node tests/test_invoice_parser_v24.js
          node tests/test_multi_ai_v253.cjs
          node tests/verificar.js
          mkdir -p tests/compiled
          javac -d tests/compiled app/src/main/java/com/controlenergia/app/GeminiModelPlanner.java tests/GeminiPlannerTest.java
          java -cp tests/compiled GeminiPlannerTest
      - name: Compilar APK Android
        working-directory: android-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-Energia-v3-0-Gemini-Informes-APK-Pruebas
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
