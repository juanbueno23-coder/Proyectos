name: Build Control de Energia v2.5.3 ChatGPT y Gemini
on:
  push:
    branches: [control-de-energia-chatgpt-gemini-v253]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android sources
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source-v253.tar.gz.base64 | tar -xz -C android-build
          test -f android-build/app/src/main/java/com/controlenergia/app/EnergyGeminiAdvisor.java
          test -f android-build/app/src/main/java/com/controlenergia/app/EnergyAiAdvisor.java
      - name: Test sources and providers
        working-directory: android-build
        run: |
          node --check app/src/main/assets/energy-ai.js
          node tests/test_multi_ai_v253.cjs
          node tests/test_v25.cjs
          node tests/test_invoice_parser_v24.js
          node tests/verificar.js
      - name: Build debug APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-Energia-v2-5-3-ChatGPT-Gemini-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
