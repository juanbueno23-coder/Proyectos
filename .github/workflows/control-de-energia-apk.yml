name: Compilar Control de Energía Android v2.1
on:
  push:
    branches: [control-de-energia-v2-20261114]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer fuente y comprobar entorno
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source.tar.gz.base64 | tar -xz -C android-build
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -f android-build/app/src/main/AndroidManifest.xml
          sed -i 's/private void event(String type,JSONObject payload)/private void event(String type,Object payload)/' android-build/app/src/main/java/com/controlenergia/app/EnergyMailController.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-build/app/build.gradle")
          s = p.read_text()
          extra = "  packaging { resources { excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE', 'META-INF/LICENSE'] } }\n"
          s = s.replace("  compileOptions {", extra + "  compileOptions {")
          p.write_text(s)
          PY
      - name: Outlook solo correo (sin ID técnico para el usuario)
        env:
          CONTROL_ENERGIA_MS_CLIENT_ID: ${{ vars.CONTROL_ENERGIA_MS_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          r=Path("android-build")
          def update(relative,old,new):
              p=r/relative
              s=p.read_text()
              if old not in s: raise RuntimeError("Bloque no encontrado: "+relative+" : "+old[:35])
              p.write_text(s.replace(old,new,1))
          h="app/src/main/assets/index.html"
          update(h, '<p class="small muted">Conexión por código de Microsoft. El propietario debe registrar una aplicación con permiso Mail.Read y permitir clientes públicos. No solicita la contraseña.</p>', '<p class="small muted">Escribe tu correo. Microsoft solicitará la autorización oficial; nunca escribas aquí la contraseña.</p>')
          update(h, '<label for="energyMicrosoftClient">ID público de aplicación Microsoft Entra</label><input id="energyMicrosoftClient" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocapitalize="off">', '<label for="energyMicrosoftEmail">Correo Outlook, Hotmail o Microsoft 365</label><input id="energyMicrosoftEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="usuario@outlook.com">')
          update(h, '<button class="primary" id="energyMicrosoftConnect">Conectar con Microsoft</button>', '<button class="primary" id="energyMicrosoftConnect">Conectar mi correo Microsoft</button>')
          j="app/src/main/assets/energy-mail.js"
          update(j, "const id=$('#energyMicrosoftClient').value.trim();localStorage.setItem('energy_ms_client_id',id);api.energyConnectMicrosoft(id);return;", "const email=$('#energyMicrosoftEmail').value.trim().toLowerCase();if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))return toast('Introduce un correo válido');api.energyConnectMicrosoft(email);return;")
          update(j, "clearInterval(energyStartup);$('#energyMicrosoftClient').value=localStorage.getItem('energy_ms_client_id')||'';", "clearInterval(energyStartup);")
          update(j, 'target="_blank" rel="noopener"', 'rel="noopener"')
          a="app/src/main/java/com/controlenergia/app/EnergyMailController.java"
          old='''    public void connectMicrosoft(String clientId){if(clientId==null||!clientId.matches("[a-fA-F0-9-]{36}")){fail("Falta el ID de aplicación Microsoft registrado en Entra");return;}
                  new Thread(()->deviceFlow(clientId)).start();}
              private void deviceFlow(String clientId){try{'''
          new=r'''    public void connectMicrosoft(String email){
                  final String wanted=email==null?"":email.trim().toLowerCase(java.util.Locale.ROOT);
                  if(!wanted.matches("[^\\s@]+@[^\\s@]+\\.[^\\s@]+")){fail("Introduce un correo válido");return;}
                  final String clientId=BuildConfig.MICROSOFT_CLIENT_ID;
                  if(clientId==null||!clientId.matches("[a-fA-F0-9-]{36}")){fail("Outlook requiere que el desarrollador active la aplicación en Microsoft. Solo necesitas tu correo y autorizarlo.");return;}
                  new Thread(()->deviceFlow(clientId,wanted)).start();
              }
              private void deviceFlow(String clientId,String expectedEmail){try{'''
          update(a,old,new)
          update(a, '.put("verification_uri",request.getString("verification_uri")).put("expires_in",request.optInt("expires_in",900));', '.put("verification_uri",request.getString("verification_uri")).put("expires_in",request.optInt("expires_in",900)).put("email",expectedEmail);')
          update(a, 'String email=profile.optString("mail",profile.optString("userPrincipalName"));if(email.isEmpty())throw new IllegalStateException("Microsoft no devolvió dirección de correo");', 'String email=profile.optString("mail");if(email.trim().isEmpty())email=profile.optString("userPrincipalName");if(email.trim().isEmpty())throw new IllegalStateException("Microsoft no devolvió dirección de correo");if(!expectedEmail.equalsIgnoreCase(email.trim()))throw new IllegalStateException("La cuenta autorizada ("+email+") no coincide con "+expectedEmail);')
          update("app/src/main/java/com/controlenergia/app/MainActivity.java", '@JavascriptInterface public void energyConnectMicrosoft(String client){energyMail.connectMicrosoft(client);}', '@JavascriptInterface public void energyConnectMicrosoft(String email){energyMail.connectMicrosoft(email);}')
          g="app/build.gradle"
          update(g, "plugins { id 'com.android.application' }", """plugins { id 'com.android.application' }
          def microsoftClientId = (project.findProperty('microsoftClientId') ?: System.getenv('CONTROL_ENERGIA_MS_CLIENT_ID') ?: '').toString().trim()
          if (microsoftClientId && !(microsoftClientId ==~ /[a-fA-F0-9-]{36}/)) throw new GradleException('ID Microsoft inválido')""")
          update(g, "  compileSdk 35", "  compileSdk 35\n  buildFeatures {buildConfig true}")
          update(g, "    versionCode 20\n    versionName '2.0.0'", """    versionCode 21
              versionName '2.1.0'
              buildConfigField 'String', 'MICROSOFT_CLIENT_ID', '"' + microsoftClientId + '"'""")
          print("Cambio Outlook correo solamente verificado")
                    PY
      - name: Compilar APK Android
        working-directory: android-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-Energia-v2-1-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
