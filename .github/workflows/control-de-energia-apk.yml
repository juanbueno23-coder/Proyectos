name: Validar Control de Energía Android 2.2.0

on:
  push:
    branches: [control-de-energia-v2-20261114]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer fuente Android
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source.tar.gz.base64 | tar -xz -C android-build
          test -f android-build/app/src/main/AndroidManifest.xml
          test -f android-build/app/src/test/java/com/controlenergia/app/EnergyMailVaultTest.java
      - name: Pruebas, análisis y APK de integración
        working-directory: android-build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Control-de-Energia-2.2.0-validacion
          path: |
            android-build/app/build/test-results/testDebugUnitTest/
            android-build/app/build/reports/lint-results-debug.*
            android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

# El APK público de CI usa una firma temporal y NO sirve para actualizaciones estables.
# La clave privada de desarrollo se conserva fuera del repositorio y nunca se sube a GitHub.
