name: Compilar Control de Energia 2.2 - historial y facturas
on:
  push:
    branches: [control-de-energia-v2-20261114]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar fuente y comprobar seguridad
        run: |
          mkdir -p android-build
          base64 -d control-de-energia/source-v22.tar.gz.base64 | tar -xz -C android-build
          test -f android-build/app/src/main/AndroidManifest.xml
          grep -q "historyRemaining" android-build/app/src/main/java/com/controlenergia/app/EnergyMailSync.java
          grep -q "readDocument" android-build/app/src/main/java/com/controlenergia/app/EnergyMailVault.java
          grep -q "com.controlenergia.revision22" android-build/app/build.gradle
      - name: Validar JavaScript
        run: |
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/energy-mail.js
      - name: Compilar APK
        working-directory: android-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-Energia-v2-2-APK-pruebas
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
